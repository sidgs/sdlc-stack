services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dev
    volumes:
      - ./data/pgvector_data:/var/lib/postgresql/data
  
  saps-db:
    image: pgvector/pgvector:pg16
    container_name: saps-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dev
    volumes:
      - ./data/saps-db_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    platform: linux/amd64
    ports:
      - "1025:1025"
      - "8025:8025"

  npm-registry:
    image: verdaccio/verdaccio
    container_name: verdaccio
    ports:
      - "4873:4873"
    volumes:
      - ./data/npm-registry_data:/verdaccio/storage

  kong:
    image: kong:latest
    platform: linux/amd64
    container_name: kong
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yaml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"
      KONG_ADMIN_GUI_URL: "http://localhost:8002"
    volumes:
      - ~/.sdlc-stacks/data/kong-apim/kong.yaml:/etc/kong/kong.yaml:ro

  litellm:
    image: ghcr.io/berriai/litellm:v1.87.0
    platform: linux/amd64
    container_name: litellm
    ports:
      - "4000:4000"
    environment:
      # DATABASE_URL: postgresql://dev:dev@pgvector:5432/dev
      STORE_MODEL_IN_DB: "False"
      LITELLM_MASTER_KEY: sk-1234
      LITELLM_SALT_KEY: sk-1234
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY: true

    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command:
      - "--config=/app/config.yaml"
    depends_on:
      - pgvector
      - redis
  markitdown:
    image: sidgs.jfrog.io/sami/ats-markitdown:0.2.0
    platform: linux/amd64
    ports:
      - "8091:8091"

  sami-mem0:
    image: sidgs.jfrog.io/sami/sami-agent-memory:0.1.0
    container_name: sami-mem0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8888:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # LiteLLM proxy on the host. The process appends /v1. Model names are proxy aliases.
      LITELLM_API_BASE: ${LITELLM_API_BASE:-http://litellm:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-1234}
      LITELLM_DEFAULT_MODEL: ${LITELLM_DEFAULT_MODEL:-default}
      LITELLM_EMBED_MODEL: ${LITELLM_EMBED_MODEL:-embedding-1536}
      MEM0_EMBED_DIMS: ${MEM0_EMBED_DIMS:-1536}
      # Chroma only. Uncomment with the volume below, and set MODE=LOCAL.
      # MODE: LOCAL
      # MEM0_CHROMA_PATH: /app/chroma
      MEM0_PG_CONNECTION_STRING: ${MEM0_PG_CONNECTION_STRING:-}
      MEM0_PG_HOST: pgvector
      MEM0_PG_PORT: "5432"
      MEM0_PG_DB: ${MEM0_PG_DB:-mem0}
      MEM0_PG_USER: dev
      MEM0_PG_PASSWORD: dev
      MEM0_PG_SSLMODE: ${MEM0_PG_SSLMODE:-}
      MEM0_PG_COLLECTION: ${MEM0_PG_COLLECTION:-memories}
      MEM0_HISTORY_DB_PATH: /tmp/mem0-history.db
      MEM0_AUTH_ENABLED: ${MEM0_AUTH_ENABLED:-false}
      MEM0_API_KEY: ${MEM0_API_KEY:-}
    # Chroma data volume. Not used with pgvector.
    # volumes:
    #   - mem0_chroma:/app/chroma
# volumes:
#   mem0_chroma:
